[mesh]
Nx=64
Ny=64
xmin=0.0
xmax=1.0
ymin=0.0
ymax=1.0

[run]
tend=1.0
save_freq=1.0
boundaries_x=periodic
boundaries_y=periodic
output_filename=gresho_vortex_$rsolver$

[solvers]
riemann_solver=$rsolver$
reconstruction=plm
time_stepping=RK2
CFL=0.5

[physics]
gamma0=1.4
problem=gresho_vortex

[gresho_vortex]
Mach=1.0
