; Parameters used for the problem: diffusion

[mesh]
nghosts                    = 2                    ; default
nx                         = 64
ny                         = 64
xmax                       = 1.000000000000e+00
xmin                       = 0.000000000000e+00
ymax                       = 1.000000000000e+00
ymin                       = 0.000000000000e+00

[physics]
fslp_k                     = 1.100000023842e+00   ; default
gamma0                     = 1.399999976158e+00
problem                    = diffusion
well_balanced_flux_at_y_bc = false                ; default

[run]
boundaries_x               = periodic
boundaries_y               = periodic
multiple_outputs           = false                ; default
output_filename            = diffusion_hll
output_path                = ./                   ; default
save_freq                  = 1.000000000000e+00
tend                       = 1.000000000000e+00

[solvers]
cfl                        = 1.000000014901e-01
reconstruction             = plm
riemann_solver             = hll
time_stepping              = euler                ; default

[thermal_conduction]
active                     = false
bc_ymax                    = none                 ; default
bc_ymax_value              = 1.000000000000e+00   ; default
bc_ymin                    = none                 ; default
bc_ymin_value              = 1.000000000000e+00   ; default
conductivity_mode          = constant             ; default
kappa                      = 1.000000047497e-03

[viscosity]
active                     = true
mu                         = 9.999999776483e-03
viscosity_mode             = constant             ; default
