[mesh]
Nx=52
Ny=64
xmin=0.0
xmax=0.8
ymin=0.0
ymax=1.0

[run]
tend=1.0
save_freq=1.0
output_filename=C91_$rsolver$
boundaries_x=reflecting
boundaries_y=C91

[solvers]
riemann_solver=$rsolver$
reconstruction=plm
CFL=0.1

[physics]
gamma0=1.66666667
problem=C91
well_balanced_flux_at_y_bc=false

[gravity]
mode=constant
gx=0.0
gy=20.0

[c91]
perturbation=0.0

[polytrope]
theta1=10.0
m1=1.0

[thermal_conduction]
active=true
kappa=0.07

bc_ymin=fixed_temperature
bc_ymax=fixed_gradient

bc_ymin_value=1.0
bc_ymax_value=10.0

[viscosity]
active=true
mu=0.0028
