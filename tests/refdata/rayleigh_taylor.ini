[mesh]
Nx=50
Ny=150
xmin=-0.25
xmax= 0.25
ymin=-0.75
ymax= 0.75

[run]
tend=1.0
save_freq=1.0
output_filename=rayleigh_taylor_$rsolver$
boundaries_x=reflecting
boundaries_y=reflecting

[solvers]
riemann_solver=$rsolver$
reconstruction=plm
CFL=0.1

[physics]
gamma0=1.4
problem=rayleigh-taylor
gravity=true

[gravity]
mode=constant
gx=0.0
gy=-0.1
