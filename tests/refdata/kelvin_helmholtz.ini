[mesh]
Nx=64
Ny=64
xmin=0.0
xmax=1.0
ymin=0.0
ymax=0.5

[run]
tend=2.0
save_freq=2.0
boundaries_x=periodic
boundaries_y=absorbing
output_filename=kelvin_helmholtz_$rsolver$

[solvers]
riemann_solver=$rsolver$
reconstruction=plm
CFL=0.8

[physics]
gamma0=1.6666667
problem=kelvin_helmholtz

[kelvin_helmholtz]
rho_fac=1.0
z1=0.5
z2=1.5
a=0.05
Amp=0.01
sigma=0.2
P0=10.0
uflow=1.0
