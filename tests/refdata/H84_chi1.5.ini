[mesh]
Nx=40
Ny=40
xmin=0.0
xmax=1.0
ymin=2.0
ymax=3.0

[run]
tend=2.0
save_freq=2.0
output_filename=H84_$rsolver$
boundaries_x=periodic
boundaries_y=reflecting

[solvers]
time_stepping=RK2
riemann_solver=$rsolver$
reconstruction=plm
CFL=0.1

[physics]
gamma0=1.66666667
problem=H84
well_balanced_flux_at_y_bc=false

[gravity]
mode=constant
gy=2.0
gx=0.0

[H84]
perturbation=0.0

[polytrope]
m1=1.0

[thermal_conduction]
active=true
kappa=0.0071

bc_xmin=fixed_temperature
bc_xmax=fixed_gradient

bc_xmin_value=2.0
bc_xmax_value=1.0

[viscosity]
active=true
mu=0.0028

[misc]
log_frequency=1000
